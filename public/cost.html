<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coût d'impression - Klipper</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/overlay.css">
  <link rel="stylesheet" href="/cost.css">
</head>
<body>
  <div class="app cost-app">
    <div class="status-bar">
      <div class="status-pill" id="connection-status">
        <svg class="pulse-dot" width="8" height="8"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>
        <span id="status-label">Connecté</span>
      </div>
    </div>

    <section class="card">
      <div class="card-header">
        <div class="state-badge" id="state-badge" data-state="idle">
          <svg class="state-icon" id="state-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
          <span id="state-text">Inactif</span>
        </div>
        <div class="cost-total">
          <div class="cost-total-label">Total</div>
          <div class="cost-total-value" id="cost-total">0,00 €</div>
        </div>
      </div>
      <div class="card-content">
        <div class="print-info">
          <div class="filename" id="filename">Aucune impression</div>
        </div>
        <div class="meta-row">
          <div class="meta-item">
            <span class="meta-label">Début</span>
            <span class="meta-value" id="started-at">--:--</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Durée</span>
            <span class="meta-value" id="elapsed">--:--</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Puissance</span>
            <span class="meta-value" id="power-w">-- W</span>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <span>Répartition des coûts</span>
      </div>
      <div class="cost-grid">
        <div class="cost-card">
          <div class="cost-card-label">Électricité</div>
          <div class="cost-card-value" id="cost-electricity">0,00 €</div>
        </div>
        <div class="cost-card">
          <div class="cost-card-label">Filament</div>
          <div class="cost-card-value" id="cost-filament">0,00 €</div>
        </div>
        <div class="cost-card">
          <div class="cost-card-label">Usure machine</div>
          <div class="cost-card-value" id="cost-wear">0,00 €</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <span>Énergie & matière</span>
      </div>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Énergie</span>
          <span class="info-value" id="energy-kwh">-- kWh</span>
        </div>
        <div class="info-item">
          <span class="info-label">Filament</span>
          <span class="info-value" id="filament-g">-- g</span>
        </div>
        <div class="info-item">
          <span class="info-label">Estimation</span>
          <span class="info-value" id="estimated-time">--:--</span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <span>Historique récent</span>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-state">
          <div class="empty-text">Chargement...</div>
        </div>
      </div>
    </section>

    <div class="footer">
      <span id="last-update">--:--:--</span>
    </div>
  </div>

  <script src="/cost.js"></script>
</body>
</html>
